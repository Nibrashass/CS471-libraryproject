<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
</head>
<body>

<h1>Edit Book</h1>

<form method="post">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title" value="{{ book.title }}">
    <br><br>

    <label>Author:</label>
    <input type="text" name="author" value="{{ book.author }}">
    <br><br>

    <button type="submit">Update Book</button>
</form>

<br>

<a href="/books/lab9_part1/listbooks">Back to Books List</a>

</body>
</html>
