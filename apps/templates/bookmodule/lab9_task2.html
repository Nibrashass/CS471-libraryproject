<!DOCTYPE html>
<html>
<head>
    <title>Lab 9 Task 2</title>
</head>
<body>

<h2>Publishers with Total Book Stock</h2>

<table border="1">
    <tr>
        <th>Publisher Name</th>
        <th>Total Book Stock</th>
    </tr>

    {% for publisher in publishers %}
    <tr>
        <td>{{ publisher.name }}</td>
        <td>{{ publisher.total_books }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
