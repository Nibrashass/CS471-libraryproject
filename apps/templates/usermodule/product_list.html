<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>Products List</h1>

<a href="{% url 'add_product' %}">Add Product</a>

<hr>

{% for product in products %}

<p>Name: {{ product.name }}</p>

<p>Price: {{ product.price }}</p>

<img src="{{ product.image.url }}" width="200">

<hr>

{% endfor %}

</body>
</html>
