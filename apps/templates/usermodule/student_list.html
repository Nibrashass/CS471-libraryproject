<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>

<h1>Students List</h1>

<a href="{% url 'add_student' %}">Add Student</a>

<hr>

{% for student in students %}

<p>
    Name: {{ student.name }}
</p>

<p>
    Age: {{ student.age }}
</p>

<p>
    Address: {{ student.address }}
</p>

<a href="{% url 'update_student' student.id %}">Update</a>

<a href="{% url 'delete_student' student.id %}">Delete</a>

<hr>

{% endfor %}

</body>
</html>
